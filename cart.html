<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Section</title>
    <style>
      body {
        background-image: url("../images/review-bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* header css */
      .header {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 0;
        margin-top: 20px;
      }
      .header h1 {
        font-size: 20px;
        margin: 0;
        color: #fff;
      }
      .header p {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #fff;
      }
      .logo-image {
        width: 90px;
        height: 70px;
      }
      .logo-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* card list container css */

      .cart-wrapper {
        display: grid;
        grid-template-columns: 1fr 500px;
        gap: 40px;
        width: 100%;
        max-width: 1200px;
        margin: 50px auto;
        align-items: start;
      }

      .card {
        width: 500px;
        height: 250px;
        display: flex;
        justify-content: space-between;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(30px);
        border-radius: 15px;
        color: #fff;
        margin-bottom: 30px;
      }

      .card-image {
        width: 150px;
        height: 150px;
        margin: 30px;
      }
      .card-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card-about {
        padding: 20px;
      }

      .delivery-btn {
        width: 80px;
        height: 40px;
        background-color: gray;
        border: none;
        color: #000;
        border-radius: 20px;
        transition: 0.4s;
      }
      .delivery-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 30px gray;
      }
      .remove-from-cart-btn {
        width: 80px;
        height: 40px;
        background-color: red;
        color: #fff;
        border: none;
        border-radius: 20px;
        transition: 0.4s;
        margin-left: 10px;
      }
      .remove-from-cart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 30px red;
      }

      /* calculate total section */

      .total-price-container {
        border: 1px solid #fff;
        border-radius: 15px;
        padding: 30px;
        color: #fff;
        backdrop-filter: blur(30px);
      }

      .item-list {
        padding-left: 30px;
      }

      .item-list li {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .item-list h3 {
        flex: 1;
      }

      .item-list p {
        margin: 0;
      }

      .pay {
        width: 100px;
        height: 40px;
        border: none;
        border-radius: 20px;
        margin-left: 65px;
      }

      .back {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 100px;
        height: 40px;
        border-radius: 20px;
        border: none;
        background: linear-gradient(135deg, #435f25, #fff, #435f25);
        color: #000;
      }

      @media (max-width: 600px) {
        body {
          background-attachment: scroll;
        } /* ---------- HEADER ---------- */
        .header {
          margin-top: 10px;
        }
        .header h1 {
          font-size: 17px;
        }
        .header p {
          font-size: 9px;
          letter-spacing: 1.5px;
        }
        .logo-image {
          width: 65px;
          height: 50px;
        } /* ---------- CART WRAPPER ---------- */
        .cart-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
          max-width: 100%;
          gap: 20px;
          margin: 25px auto;
        } /* ---------- CARD LIST ---------- */
        .card-list {
          width: 50%;
          display: flex;
          flex-direction: column;
          align-items: center;
        } /* ---------- PRODUCT CARD ---------- */
        .card {
          width: 90%;
          max-width: 400px;
          height: 160px;
          margin-bottom: 15px;
          border-radius: 12px;
        } /* ---------- PRODUCT IMAGE ---------- */
        .card-image {
          width: 90px;
          height: 90px;
          margin: 20px 10px;
        } /* ---------- PRODUCT INFO ---------- */
        .card-about {
          padding: 12px;
          font-size: 12px;
          flex: 1;
        }
        .card-about h2 {
          font-size: 16px;
          margin: 0 0 5px;
        }
        .card-about p {
          font-size: 11px;
          margin: 4px 0;
        } /* ---------- BUTTONS ---------- */
        .delivery-btn,
        .remove-from-cart-btn {
          width: 65px;
          height: 30px;
          font-size: 10px;
          border-radius: 15px;
        }
        .remove-from-cart-btn {
          margin-left: 4px;
        } /* ---------- TOTAL PRICE ---------- */
        .total-price-container {
          width: 90%;
          max-width: 500px;
          padding: 18px;
          border-radius: 12px;
          font-size: 12px;
          box-sizing: border-box;
        }
        .item-list {
          padding-left: 18px;
        }
        .item-list li {
          gap: 10px;
        }
        .item-list h3 {
          font-size: 13px;
        }
        .item-list p {
          font-size: 12px;
        } /* ---------- PAY BUTTON ---------- */
        .pay {
          width: 80px;
          height: 32px;
          margin-left: 0;
          font-size: 11px;
        } /* ---------- BACK BUTTON ---------- */
        .back {
          position: static;
          display: block;
          width: 75px;
          height: 32px;
          margin: 10px auto 25px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <!-- header page start -->

    <div class="header">
      <div class="logo-image">
        <img src="images/logo-darkmode.png" />
      </div>
      <h1>Ban's Scent</h1>
      <p>every thing about scent</p>
      <div class="menu-list">
        <a href="index.html"></a>
        <a href="#"></a>
        <a href="#"></a>
        <a href="#"></a>
        <a href="#"></a>
      </div>
    </div>

    <!-- header page end -->

    <div class="cart-wrapper">
      <div class="card-list"></div>

      <div class="total-price-container">
        <div class="total-price"></div>
      </div>
    </div>
    <button onclick="window.location.href = './shop.html'" class="back">
      Back
    </button>

    <script type="module" src="./JavaScript/cart.js"></script>
  </body>
</html>
